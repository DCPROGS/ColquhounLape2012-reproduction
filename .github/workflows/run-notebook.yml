name: run notebook

# Executes the reproduction notebook against the pinned SCALCS release.
# The notebook's final cell asserts every published value, so a failure here
# means a number has stopped being reproduced - not merely that the code broke.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly, to catch breakage caused by new releases of the dependencies.
    - cron: '0 6 1 * *'

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the environment
        run: |
          python -c "import scalcs, numpy, scipy, pandas, matplotlib; \
            print('scalcs    ', scalcs.__file__); \
            print('numpy     ', numpy.__version__); \
            print('scipy     ', scipy.__version__); \
            print('pandas    ', pandas.__version__); \
            print('matplotlib', matplotlib.__version__)"
          pip freeze

      - name: Execute the notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1800 \
            ColquhounLape2012_reproduction.ipynb \
            --output executed.ipynb

      - name: Confirm the verification cell ran and passed
        run: |
          python - <<'PY'
          import json, sys
          nb = json.load(open('executed.ipynb', encoding='utf-8'))
          text = ''.join(
              ''.join(o.get('text', ''))
              for c in nb['cells'] if c['cell_type'] == 'code'
              for o in c.get('outputs', []) if o.get('output_type') == 'stream')
          errors = [o for c in nb['cells'] if c['cell_type'] == 'code'
                    for o in c.get('outputs', []) if o.get('output_type') == 'error']
          if errors:
              sys.exit('cell errors: %s' % [e.get('ename') for e in errors])
          if 'ALL CHECKS PASSED' not in text:
              sys.exit('the verification cell did not report success')
          print('verification cell passed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
